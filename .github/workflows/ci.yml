name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start a throwaway PostgreSQL 17 via Testcontainers;
      # GitHub's Ubuntu runners have Docker available out of the box.
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only (no push) — proves the production image, including the
      # PostgreSQL 17 client install, still builds before anything deploys.
      - name: Build image
        run: docker build -t ikiminaconnect-api:ci backend
      - name: pg_dump in the image matches PostgreSQL 17
        run: docker run --rm --entrypoint pg_dump ikiminaconnect-api:ci --version | grep -E "\) 17\."
