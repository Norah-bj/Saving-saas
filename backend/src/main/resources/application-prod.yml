# Production profile overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# Every secret below has NO default — the app must fail to start rather than
# silently run with the dev placeholder in a real environment.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    rw.ikiminaconnect: INFO
    org.hibernate.SQL: WARN
