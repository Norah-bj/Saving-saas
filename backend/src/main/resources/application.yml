spring:
  application:
    name: ikiminaconnect-api

  datasource:
    # The existing PostgreSQL 17 Windows service on this machine (postgresql-x64-17),
    # default port 5432. A dedicated `ikiminaconnect` role + database were created on
    # that instance for this project only — nothing else on it is touched. See
    # docs/backend/DEV_SETUP.md.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ikiminaconnect}
    username: ${DB_USERNAME:ikiminaconnect}
    password: ${DB_PASSWORD:ikiminaconnect_dev}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema — Hibernate must never auto-generate/alter DDL.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Default 1MB is too tight for a real payroll .xlsx export. Payroll
      # import is the only file-upload endpoint so far (phase 4).
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # Dev-only default — 256-bit+ random key required for HS256. MUST be
    # overridden via JWT_SECRET in any non-local environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-in-every-real-environment-0123456789}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Used to build the verification link sent by email — see auth/EmailVerificationService.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  email-verification:
    ttl-hours: 24
  email:
    provider: ${EMAIL_PROVIDER:console}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:onboarding@resend.dev}
  # Unset by default — POST /auth/bootstrap-super-admin refuses every request
  # until an operator explicitly sets SUPER_ADMIN_BOOTSTRAP_TOKEN (and the
  # endpoint only ever succeeds once regardless). See docs/DEVELOPMENT.md.
  super-admin-bootstrap-token: ${SUPER_ADMIN_BOOTSTRAP_TOKEN:}
  backup:
    # Real pg_dump, run as a subprocess — see backup/BackupFileService and
    # docs/DECISIONS.md (platform-wide only, SUPER_ADMIN-triggered, no
    # in-app restore). `pg-dump-path` defaults to a bare command name,
    # correct wherever the postgresql-client tools are on PATH (a real
    # Linux deployment with the client installed); override for local dev
    # environments where they aren't (see docs/DEVELOPMENT.md).
    directory: ${BACKUP_DIRECTORY:./backups}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
    db-host: ${DB_HOST:localhost}
    db-port: ${DB_PORT:5432}
    db-name: ${DB_NAME:ikiminaconnect}

logging:
  level:
    rw.ikiminaconnect: INFO
